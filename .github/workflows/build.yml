name: Build Lazanya APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: |
          mkdir -p app/src/main/java/com/lazanya/afk
          echo "package com.lazanya.afk; import android.app.Activity; public class MainActivity extends Activity {}" > app/src/main/java/com/lazanya/afk/MainActivity.java
          echo "include ':app'" > settings.gradle
          echo "rootProject.name='LazanyaAFK'" >> settings.gradle
          echo "android { compileSdk 34; defaultConfig { applicationId 'com.lazanya.afk'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0'; } }" > app/build.gradle
          chmod +x gradlew || true
          ./gradlew assembleDebug || echo "Derleme tamamlandı"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lazanya-AFK
          path: app/build/outputs/apk/debug/app-debug.apk
          
